name: s81_onepiece_flutterapp_libconnect
description: A minimal counter app for Flutter fundamentals assessment.
version: 0.0.1
environment:
  sdk: '>=2.17.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # Firebase dependencies
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_analytics: ^11.0.0
  cloud_functions: ^5.0.0
  firebase_messaging: ^15.0.0
  
  # Media & File handling
  image_picker: ^1.0.0
  google_maps_flutter: ^2.7.0
  geolocator: ^13.0.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
